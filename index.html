
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZERAXXSTORE | Blox Fruits Store Malaysia</title>

  <meta name="description" content="ZERAXXSTORE (ZERAXX STORE) ialah kedai Blox Fruits Malaysia. Beli Blox Fruits seperti Buddha, Spider, Magma, Love, Creation dan Rubber.">

  <meta name="keywords" content="ZERAXXSTORE, ZERAXX STORE, Zeraxx Store Malaysia, Blox Fruits Malaysia, Blox Fruits Store, beli Blox Fruits, Buddha Fruit, Spider Fruit, Magma Fruit, Love Fruit, Creation Fruit, Rubber Fruit">

  <meta name="robots" content="index, follow">

  <meta name="author" content="ZERAXXSTORE">

  <meta property="og:title" content="ZERAXXSTORE | Blox Fruits Store Malaysia">
  <meta property="og:description" content="Beli Blox Fruits di ZERAXXSTORE. Buddha, Spider, Magma, Love, Creation, Rubber dan banyak lagi.">
  <meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #080808;
      color: #fff;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(8, 8, 8, 0.97);
      border-bottom: 1px solid #292929;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      color: #ff2020;
      letter-spacing: 1px;
    }

    .logo span {
      color: #fff;
    }

    .search {
      width: 260px;
    }

    .search input {
      width: 100%;
      padding: 11px 16px;
      border-radius: 25px;
      border: 1px solid #333;
      outline: none;
      background: #151515;
      color: #fff;
      font-size: 14px;
    }

    .search input:focus {
      border-color: #ff2020;
    }

    /* HERO */
    .hero {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .poster {
      width: 100%;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #292929;
      background: #111;
    }

    .poster img {
      display: block;
      width: 100%;
      max-height: 430px;
      object-fit: cover;
    }

    /* STORE */
    .store-info {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .store-title {
      font-size: 29px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .store-title span {
      color: #ff2020;
    }

    .description {
      color: #999;
      font-size: 14px;
      line-height: 1.6;
    }

    /* PRODUCTS */
    .products-section {
      max-width: 1200px;
      margin: 30px auto 60px;
      padding: 0 15px;
    }

    .section-title {
      font-size: 23px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .section-title span {
      color: #ff2020;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 16px;
    }

    .product-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      overflow: hidden;
      transition: 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: #ff2020;
      box-shadow: 0 8px 25px rgba(255, 0, 0, 0.15);
    }

    .product-image {
      width: 100%;
      height: 175px;
      background: #181818;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    .product-info {
      padding: 13px;
    }

    .product-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .price {
      color: #ff3030;
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .stock {
      color: #61e76a;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .stock.out {
      color: #ff4040;
    }

    .buy-btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 10px;
      background: #e91515;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .buy-btn:hover {
      background: #ff2929;
    }

    .buy-btn:disabled {
      background: #333;
      color: #777;
      cursor: not-allowed;
    }

    /* LOADING */
    .loading,
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 10px;
      color: #777;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid #222;
      background: #050505;
      padding: 25px 15px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    footer strong {
      color: #ff2020;
    }

    /* WHATSAPP */
    .whatsapp {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #25d366;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      font-size: 25px;
      font-weight: bold;
      z-index: 999;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }

    .whatsapp:hover {
      transform: scale(1.08);
    }

    /* MOBILE */
    @media (max-width: 600px) {

      header {
        flex-direction: column;
        padding: 13px;
      }

      .logo {
        text-align: center;
      }

      .search {
        width: 100%;
      }

      .hero {
        margin-top: 12px;
      }

      .poster img {
        max-height: 260px;
      }

      .store-title {
        font-size: 24px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product-image {
        height: 140px;
      }

      .product-info {
        padding: 10px;
      }

      .product-name {
        font-size: 15px;
      }

      .price {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="logo">
      ZERAXX<span>STORE</span>
    </div>

    <div class="search">
      <input
        id="searchInput"
        type="text"
        placeholder="Search fruit..."
      >
    </div>

  </header>


  <!-- POSTER -->
  <section class="hero">

    <div class="poster">

      <img
        src="poster.png"
        alt="ZERAXXSTORE"
        onerror="this.parentElement.style.display='none'"
      >

    </div>

  </section>


  <!-- STORE INFORMATION -->
  <section class="store-info">

    <h1 class="store-title">
      ZERAXX<span>STORE</span>
    </h1>

    <p class="description">
      Blox Fruits item store. Pilih fruit yang anda inginkan,
      kemudian tekan BUY NOW untuk order melalui WhatsApp.
    </p>

  </section>


  <!-- PRODUCTS -->
  <section class="products-section">

    <h2 class="section-title">
      Available <span>Fruits</span>
    </h2>

    <div
      id="products"
      class="products"
    >

      <div class="loading">
        Loading products...
      </div>

    </div>

  </section>


  <!-- FOOTER -->
  <footer>
    © 2026 <strong>ZERAXXSTORE</strong> · Blox Fruits Items
  </footer>


  <!-- WHATSAPP BUTTON -->
  <a
    class="whatsapp"
    href="https://wa.me/60193019528"
    target="_blank"
    aria-label="WhatsApp"
  >
    ☎
  </a>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* ==========================================
       FIREBASE CONFIG KAU
       ========================================== */

    const firebaseConfig = {

      apiKey: "AIzaSyADyVbRfEbHlnwsx38Y6VMn51QbOEFfWgM",

      authDomain: "zerraxx-store.firebaseapp.com",

      projectId: "zerraxx-store",

      storageBucket: "zerraxx-store.firebasestorage.app",

      messagingSenderId: "946691118004",

      appId: "1:946691118004:web:cf189cc85f11380c3fd8e1",

      measurementId: "G-006D7F68L4"

    };


    /* ==========================================
       INITIALIZE
       ========================================== */

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    /* ==========================================
       ELEMENTS
       ========================================== */

    const productsContainer =
      document.getElementById("products");

    const searchInput =
      document.getElementById("searchInput");


    let allProducts = [];


    /* ==========================================
       DEFAULT FRUITS
       Digunakan kalau Firebase belum ada
       data product.
       ========================================== */

    const defaultProducts = [

      {
        name: "Buddha",
        price: 1.50,
        image: "buddha.png",
        stock: 2
      },

      {
        name: "Spider",
        price: 2.00,
        image: "spider.png",
        stock: 2
      },

      {
        name: "Magma",
        price: 1.00,
        image: "magma.png",
        stock: 1
      },

      {
        name: "Love",
        price: 2.00,
        image: "love.png",
        stock: 1
      },

      {
        name: "Creation",
        price: 3.00,
        image: "creation.png",
        stock: 1
      },

      {
        name: "Rubber",
        price: 1.00,
        image: "rubber.png",
        stock: 1
      },

      {
        name: "Gas",
        price: 5.00,
        image: "gas.png",
        stock: 1
      }
    ];


    /* ==========================================
       LOAD PRODUCTS DARI FIRESTORE
       COLLECTION: products
       ========================================== */

    onSnapshot(

      collection(db, "products"),

      (snapshot) => {

        allProducts = [];


        snapshot.forEach((doc) => {

          const data = doc.data();


          allProducts.push({

            id: doc.id,

            name:
              data.name ||
              data.title ||
              doc.id,

            price:
              data.price ?? 0,

            stock:
              data.stock ??
              data.quantity ??
              0,

            image:
              data.image ||
              "",

            ...data

          });

        });


        /*
          Kalau collection products kosong,
          guna default products.
        */

        if (allProducts.length === 0) {

          allProducts =
            defaultProducts;

        }


        renderProducts(
          allProducts
        );

      },

      (error) => {

        console.error(
          "Firebase Error:",
          error
        );


        productsContainer.innerHTML = `

          <div class="empty">

            <strong>
              Tak dapat sambung Firebase.
            </strong>

            <br><br>

            ${escapeHTML(error.message)}

          </div>

        `;

      }

    );


    /* ==========================================
       RENDER PRODUCTS
       ========================================== */

    function renderProducts(products) {

      productsContainer.innerHTML = "";


      if (products.length === 0) {

        productsContainer.innerHTML = `

          <div class="empty">
            Tiada product dijumpai.
          </div>

        `;

        return;

      }


      products.forEach((product) => {

        const name =
          product.name ||
          "Unknown Fruit";


        let price =
          Number(product.price);


        if (Number.isNaN(price)) {

          price = 0;

        }


        let stock =
          Number(product.stock);


        if (Number.isNaN(stock)) {

          stock = 0;

        }


        /*
          IMAGE

          Kalau Firebase ada:
          image = "buddha.png"

          website akan cari:
          folder yang sama / buddha.png
        */

        let image =
          product.image;


        /*
          Kalau field image kosong,
          cuba guna default image.
        */

        if (!image) {

          const defaultProduct =
            defaultProducts.find(
              item =>
                item.name.toLowerCase() ===
                name.toLowerCase()
            );


          if (defaultProduct) {

            image =
              defaultProduct.image;

          }

        }


        /*
          Kalau masih tiada gambar.
        */

        if (!image) {

          image =
            "https://placehold.co/300x300/111111/ffffff?text=" +
            encodeURIComponent(name);

        }


        const outOfStock =
          stock <= 0;


        const card =
          document.createElement("div");

        card.className =
          "product-card";


        card.innerHTML = `

          <div class="product-image">

            <img
              src="${escapeAttribute(image)}"
              alt="${escapeAttribute(name)}"
              onerror="
                this.src='https://placehold.co/300x300/111111/ffffff?text=No+Image'
              "
            >

          </div>


          <div class="product-info">

            <div class="product-name">
              ${escapeHTML(name)}
            </div>


            <div class="price">
              RM ${price.toFixed(2)}
            </div>


            <div class="stock ${outOfStock ? "out" : ""}">
              ${
                outOfStock
                  ? "OUT OF STOCK"
                  : "Stock: " + stock
              }
            </div>


            <button
              class="buy-btn"
              ${outOfStock ? "disabled" : ""}
            >
              ${
                outOfStock
                  ? "OUT OF STOCK"
                  : "BUY NOW"
              }
            </button>

          </div>

        `;


        const button =
          card.querySelector(".buy-btn");


        if (!outOfStock) {

          button.addEventListener(
            "click",
            () => {

              orderWhatsApp(
                name,
                price,
                stock
              );

            }
          );

        }


        productsContainer.appendChild(
          card
        );

      });

    }


    /* ==========================================
       WHATSAPP ORDER
       ========================================== */

    function orderWhatsApp(
      name,
      price,
      stock
    ) {

      const text =
        `Hi ZERAXXSTORE 👋\n\n` +

        `Saya nak beli:\n` +

        `🍎 ${name}\n` +

        `💰 Harga: RM ${price.toFixed(2)}\n` +

        `📦 Stock: ${stock}\n\n` +

        `Boleh trade sekarang?`;


      const phone =
        "60193019528";


      const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(text);


      window.open(
        url,
        "_blank"
      );

    }


    /* ==========================================
       SEARCH
       ========================================== */

    searchInput.addEventListener(
      "input",
      () => {

        const keyword =
          searchInput.value
            .trim()
            .toLowerCase();


        if (!keyword) {

          renderProducts(
            allProducts
          );

          return;

        }


        const filtered =
          allProducts.filter(
            product => {

              const name =
                String(
                  product.name || ""
                ).toLowerCase();


              return name.includes(
                keyword
              );

            }
          );


        renderProducts(
          filtered
        );

      }
    );


    /* ==========================================
       SECURITY HELPERS
       ========================================== */

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeAttribute(value) {

      return String(value)

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
</html>
