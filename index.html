    /* HEADER */

    header {
      position: sticky;

    .logo {

    .poster {
      width: 100%;
      border-radius: 15px;

      border: 1px solid #292929;
      background: #111;
    }

    .poster img {
      display: block;
      width: 100%;

      object-fit: cover;
    }


    /* STORE */

    .store-info {

      margin: 25px auto;
      padding: 0 15px;
    }

    .store-title {

      margin-bottom: 8px;

    .store-title span {
      color: #ff2020;
    }

    .description {

      font-size: 14px;

    }

    }

    }

    .section-title span {
      color: #ff2020;
    }

      border: 1px solid #292929;
      border-radius: 14px;
      overflow: hidden;
      transition: 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: #ff2020;
      box-shadow: 0 8px 25px rgba(255, 0, 0, 0.15);
    }

    .product-image {
      width: 100%;
      height: 175px;
      background: #181818;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;

    }

    .product-name {

      margin-bottom: 7px;
    }

    .price {
      color: #ff3030;
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .stock {
      color: #61e76a;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .stock.out {
      color: #ff4040;
    }

    .buy-btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 10px;
      background: #e91515;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .buy-btn:hover {
      background: #ff2929;
    }

    .buy-btn:disabled {
      background: #333;
      color: #777;
      cursor: not-allowed;
    }


    /* LOADING */

    .loading,
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 10px;
      color: #777;
    }


    /* FOOTER */

    footer {
      border-top: 1px solid #222;
      background: #050505;
      padding: 25px 15px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    footer strong {
      color: #ff2020;
    }
