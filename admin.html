<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZERAXXSTORE | Admin</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #080808;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #0d0d0d;
      border-bottom: 1px solid #292929;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 23px;
      font-weight: 900;
      color: #ff2020;
    }

    .logo span {
      color: white;
    }

    .logout {
      border: 0;
      background: #333;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .login-box {
      max-width: 400px;
      margin: 70px auto;
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 25px;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #181818;
      color: white;
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #e91515;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      color: #ff5555;
      margin-top: 12px;
      font-size: 14px;
    }

    #adminPanel {
      display: none;
    }

    .title {
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .title span {
      color: #ff2020;
    }

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: #111;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 17px;
    }

    .order.pending {
      border-left: 4px solid #ffb020;
    }

    .order.completed {
      border-left: 4px solid #35d05f;
    }

    .order.cancelled {
      border-left: 4px solid #ff3030;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .product-name {
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      padding: 5px 9px;
      border-radius: 6px;
      background: #333;
      font-size: 12px;
      font-weight: bold;
    }

    .details {
      color: #aaa;
      line-height: 1.7;
      font-size: 14px;
    }

    .details strong {
      color: white;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .actions button {
      border: 0;
      padding: 9px 12px;
      border-radius: 7px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .complete {
      background: #168a3b;
    }

    .cancel {
      background: #b51e1e;
    }

    .pending-btn {
      background: #555;
    }

    .actions button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 50px 10px;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 40px;
    }

    @media (max-width: 600px) {

      header {
        padding: 14px;
      }

      .order-top {
        flex-direction: column;
      }

      .actions {
        flex-wrap: wrap;
      }

      .actions button {
        flex: 1;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="logo">
    ZERAXX<span>STORE</span>
  </div>

  <button
    class="logout"
    id="logoutBtn"
    style="display:none;"
  >
    Logout
  </button>

</header>


<!-- LOGIN -->

<div
  class="login-box"
  id="loginBox"
>

  <h2>🔐 Admin Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button
    class="login-btn"
    id="loginBtn"
  >
    LOGIN
  </button>

  <div
    class="error"
    id="loginError"
  ></div>

</div>


<!-- ADMIN -->

<div
  class="container"
  id="adminPanel"
>

  <div class="title">
    📦 <span>Orders</span>
  </div>

  <div
    class="orders"
    id="orders"
  >

    <div class="loading">
      Loading orders...
    </div>

  </div>

</div>


<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  runTransaction
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==========================================
   CONFIG
========================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyADyVbRfEbHlnwsx38Y6VMn51QbOEFfWgM",

  authDomain:
    "zerraxx-store.firebaseapp.com",

  projectId:
    "zerraxx-store",

  storageBucket:
    "zerraxx-store.firebasestorage.app",

  messagingSenderId:
    "946691118004",

  appId:
    "1:946691118004:web:cf189cc85f11380c3fd8e1",

  measurementId:
    "G-006D7F68L4"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* ==========================================
   ELEMENTS
========================================== */

const loginBox =
  document.getElementById("loginBox");

const adminPanel =
  document.getElementById("adminPanel");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const loginError =
  document.getElementById("loginError");

const ordersContainer =
  document.getElementById("orders");


/* ==========================================
   LOGIN
========================================== */

loginBtn.addEventListener(
  "click",
  async () => {

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if (!email || !password) {

      loginError.textContent =
        "Masukkan email dan password.";

      return;

    }


    loginError.textContent =
      "Logging in...";


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    } catch (error) {

      console.error(error);

      loginError.textContent =
        "Login gagal: " +
        error.message;

    }

  }
);


/* ==========================================
   LOGOUT
========================================== */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);


/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(
  auth,
  (user) => {

    if (user) {

      loginBox.style.display =
        "none";

      adminPanel.style.display =
        "block";

      logoutBtn.style.display =
        "block";

      loadOrders();

    } else {

      loginBox.style.display =
        "block";

      adminPanel.style.display =
        "none";

      logoutBtn.style.display =
        "none";

    }

  }
);


/* ==========================================
   LOAD ORDERS
========================================== */

function loadOrders() {

  onSnapshot(

    collection(
      db,
      "orders"
    ),

    (snapshot) => {

      const orders = [];


      snapshot.forEach(
        (orderDoc) => {

          orders.push({

            id:
              orderDoc.id,

            ...orderDoc.data()

          });

        }
      );


      orders.sort(
        (a, b) => {

          const timeA =
            a.createdAt?.seconds || 0;

          const timeB =
            b.createdAt?.seconds || 0;

          return timeB - timeA;

        }
      );


      renderOrders(
        orders
      );

    },

    (error) => {

      console.error(error);

      ordersContainer.innerHTML = `

        <div class="empty">

          Gagal membaca orders.

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

    }

  );

}


/* ==========================================
   RENDER
========================================== */

function renderOrders(
  orders
) {

  ordersContainer.innerHTML =
    "";


  if (
    orders.length === 0
  ) {

    ordersContainer.innerHTML = `

      <div class="empty">
        Belum ada order.
      </div>

    `;

    return;

  }


  orders.forEach(
    (order) => {

      const status =
        order.status ||
        "Pending";


      const statusClass =
        status
          .toLowerCase()
          .replace(
            " ",
            "-"
          );


      let date =
        "Belum tersedia";


      if (
        order.createdAt
      ) {

        date =
          new Date(
            order.createdAt.seconds * 1000
          ).toLocaleString(
            "ms-MY"
          );

      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "order " +
        statusClass;


      card.innerHTML = `

        <div class="order
