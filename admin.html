<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZERAXXSTORE | Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #080808;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #0d0d0d;
      border-bottom: 1px solid #292929;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 23px;
      font-weight: 900;
      color: #ff2020;
    }

    .logo span {
      color: white;
    }

    .logout {
      border: 0;
      background: #333;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .login-box {
      max-width: 400px;
      margin: 70px auto;
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 25px;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #181818;
      color: white;
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #e91515;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      color: #ff5555;
      margin-top: 12px;
      font-size: 14px;
    }

    #adminPanel {
      display: none;
    }

    .title {
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .title span {
      color: #ff2020;
    }

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: #111;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 17px;
    }

    .order.pending {
      border-left: 4px solid #ffb020;
    }

    .order.completed {
      border-left: 4px solid #35d05f;
    }

    .order.cancelled {
      border-left: 4px solid #ff3030;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .product-name {
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      padding: 5px 9px;
      border-radius: 6px;
      background: #333;
      font-size: 12px;
      font-weight: bold;
    }

    .details {
      color: #aaa;
      line-height: 1.7;
      font-size: 14px;
    }

    .details strong {
      color: white;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .actions button {
      border: 0;
      padding: 9px 12px;
      border-radius: 7px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .complete {
      background: #168a3b;
    }

    .cancel {
      background: #b51e1e;
    }

    .pending-btn {
      background: #555;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 50px 10px;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 40px;
    }

    @media (max-width: 600px) {

      header {
        padding: 14px;
      }

      .order-top {
        flex-direction: column;
      }

      .actions {
        flex-wrap: wrap;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    ZERAXX<span>STORE</span>
  </div>

  <button
    class="logout"
    id="logoutBtn"
    style="display:none;"
  >
    Logout
  </button>

</header>


<!-- LOGIN -->

<div
  class="login-box"
  id="loginBox"
>

  <h2>🔐 Admin Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Admin Email"
  >

  <div style="position:relative; margin-bottom:12px;">

  <input
    type="password"
    id="password"
    placeholder="Password"
    style="margin-bottom:0; padding-right:45px;"
  >

  <button
    type="button"
    id="togglePassword"
    style="
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:0;
      color:#aaa;
      font-size:20px;
      cursor:pointer;
    "
  >
    <svg
  id="eyeIcon"
  width="20"
  height="20"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
  <circle cx="12" cy="12" r="3"/>
</svg>
  </button>

</div>

  <button
    class="login-btn"
    id="loginBtn"
  >
    LOGIN
  </button>

  <div
    class="error"
    id="loginError"
  ></div>

</div>


<!-- ADMIN PANEL -->

<div
  class="container"
  id="adminPanel"
>

  <div class="title">
    📦 <span>Orders</span>
  </div>

  <div
    class="orders"
    id="orders"
  >

    <div class="loading">
      Loading orders...
    </div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* ==========================================
     FIREBASE
  ========================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyADyVbRfEbHlnwsx38Y6VMn51QbOEFfWgM",

    authDomain:
      "zerraxx-store.firebaseapp.com",

    projectId:
      "zerraxx-store",

    storageBucket:
      "zerraxx-store.firebasestorage.app",

    messagingSenderId:
      "946691118004",

    appId:
      "1:946691118004:web:cf189cc85f11380c3fd8e1",

    measurementId:
      "G-006D7F68L4"

  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  /* ==========================================
     ELEMENTS
  ========================================== */

  const loginBox =
    document.getElementById("loginBox");

  const adminPanel =
    document.getElementById("adminPanel");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const loginError =
    document.getElementById("loginError");

  const ordersContainer =
    document.getElementById("orders");


  /* ==========================================
     LOGIN
  ========================================== */

  loginBtn.addEventListener(
    "click",
    async () => {

      const email =
        document.getElementById("email")
          .value.trim();

      const password =
        document.getElementById("password")
          .value;


      if (!email || !password) {

        loginError.textContent =
          "Masukkan email dan password.";

        return;

      }


      loginError.textContent =
        "Logging in...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        loginError.textContent =
          "Login gagal. Semak email dan password.";

      }

    }
  );


  /* ==========================================
     LOGOUT
  ========================================== */

  logoutBtn.addEventListener(
    "click",
    async () => {

      await signOut(auth);

    }
  );


  /* ==========================================
     AUTH STATE
  ========================================== */

  onAuthStateChanged(
    auth,
    (user) => {

      if (user) {

        loginBox.style.display =
          "none";

        adminPanel.style.display =
          "block";

        logoutBtn.style.display =
          "block";

        loadOrders();

      } else {

        loginBox.style.display =
          "block";

        adminPanel.style.display =
          "none";

        logoutBtn.style.display =
          "none";

      }

    }
  );


  /* ==========================================
     LOAD ORDERS
  ========================================== */

  function loadOrders() {

    onSnapshot(

      collection(
        db,
        "orders"
      ),

      (snapshot) => {

        const orders = [];


        snapshot.forEach(
          (orderDoc) => {

            orders.push({

              id:
                orderDoc.id,

              ...orderDoc.data()

            });

          }
        );


        /*
          Order terbaru di atas
        */

        orders.sort(
          (a, b) => {

            const timeA =
              a.createdAt?.seconds || 0;

            const timeB =
              b.createdAt?.seconds || 0;

            return timeB - timeA;

          }
        );


        renderOrders(
          orders
        );

      },

      (error) => {

        console.error(error);

        ordersContainer.innerHTML = `

          <div class="empty">

            Gagal membaca orders.<br><br>

            ${escapeHTML(
              error.message
            )}

          </div>

        `;

      }

    );

  }


  /* ==========================================
     RENDER ORDERS
  ========================================== */

  function renderOrders(
    orders
  ) {

    ordersContainer.innerHTML =
      "";


    if (
      orders.length === 0
    ) {

      ordersContainer.innerHTML = `

        <div class="empty">
          Belum ada order.
        </div>

      `;

      return;

    }


    orders.forEach(
      (order) => {

        const status =
          order.status ||
          "Pending";


        const statusClass =
          status
            .toLowerCase()
            .replace(
              " ",
              "-"
            );


        let date =
          "Belum tersedia";


        if (
          order.createdAt
        ) {

          date =
            new Date(
              order.createdAt.seconds * 1000
            ).toLocaleString(
              "ms-MY"
            );

        }


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "order " +
          statusClass;


        card.innerHTML = `

          <div class="order-top">

            <div class="product-name">
              ${escapeHTML(
                order.productName ||
                "Unknown Product"
              )}
            </div>

            <div class="status">
              ${escapeHTML(
                status
              )}
            </div>

          </div>


          <div class="details">

            <div>
              🎮 Roblox:
              <strong>
                ${escapeHTML(
                  order.robloxUsername ||
                  "-"
                )}
              </strong>
            </div>

            <div>
              💰 Harga:
              <strong>
                RM ${Number(
                  order.price || 0
                ).toFixed(2)}
              </strong>
            </div>

            <div>
              🆔 Order ID:
              <strong>
                ${escapeHTML(
                  order.id
                )}
              </strong>
            </div>

            <div>
              🕐 Masa:
              <strong>
                ${escapeHTML(
                  date
                )}
              </strong>
            </div>

          </div>


          <div class="actions">

            <button
              class="pending-btn"
              data-id="${escapeAttribute(
                order.id
              )}"
              data-status="Pending"
            >
              Pending
            </button>


            <button
              class="complete"
              data-id="${escapeAttribute(
                order.id
              )}"
              data-status="Completed"
            >
              Completed
            </button>


            <button
              class="cancel"
              data-id="${escapeAttribute(
                order.id
              )}"
              data-status="Cancelled"
            >
              Cancelled
            </button>

          </div>

        `;


        const buttons =
          card.querySelectorAll(
            "button"
          );


        buttons.forEach(
          (button) => {

            button.addEventListener(
              "click",
              () => {

                updateOrderStatus(

                  button.dataset.id,

                  button.dataset.status

                );

              }
            );

          }
        );


        ordersContainer.appendChild(
          card
        );

      }
    );

  }


  /* ==========================================
     UPDATE STATUS
  ========================================== */

  async function updateOrderStatus(
  orderId,
  newStatus
) {

  try {

    const orderRef =
      doc(
        db,
        "orders",
        orderId
      );


    /* AMBIL ORDER */

    const orderSnap =
      await getDoc(
        orderRef
      );


    if (!orderSnap.exists()) {

      alert(
        "Order tidak dijumpai."
      );

      return;

    }


    const order =
      orderSnap.data();


    /* ==================================
       COMPLETED
       Tolak stock 1
    ================================== */

    if (
      newStatus === "Completed"
    ) {

      const productId =
        order.productId;


      if (!productId) {

        alert(
          "Order ini tiada Product ID."
        );

        return;

      }


      const productRef =
        doc(
          db,
          "products",
          productId
        );


      const productSnap =
        await getDoc(
          productRef
        );


      if (!productSnap.exists()) {

        alert(
          "Product tidak dijumpai."
        );

        return;

      }


      const product =
        productSnap.data();


      const currentStock =
        Number(
          product.stock ??
          product.quantity ??
          0
        );


      if (
        currentStock <= 0
      ) {

        alert(
          "Stock product sudah habis."
        );

        return;

      }


      /* TOLAK STOCK 1 */

      await updateDoc(

        productRef,

        {
          stock:
            currentStock - 1
        }

      );


      /* UPDATE ORDER */

      await updateDoc(

        orderRef,

        {
          status:
            "Completed"
        }

      );


      alert(
        "Order Completed! Stock berkurang 1."
      );


      return;

    }


    /* ==================================
       CANCELLED / PENDING
    ================================== */

    await updateDoc(

      orderRef,

      {
        status:
          newStatus
      }

    );

  } catch (error) {

    console.error(
      "UPDATE ERROR:",
      error
    );

    alert(
      "Gagal update status:\n\n" +
      error.message
    );

  }

}


  /* ==========================================
     SECURITY HELPERS
  ========================================== */

  function escapeHTML(
    value
  ) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(
    value
  ) {

    return String(value)

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }

const passwordInput =
  document.getElementById("password");

const togglePassword =
  document.getElementById("togglePassword");

togglePassword.addEventListener(
  "click",
  () => {

    if (passwordInput.type === "password") {

      passwordInput.type = "text";

    } else {

      passwordInput.type = "password";

    }

  }
);
  
</script>

</body>
</html>
