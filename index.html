<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zerraxx Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #151922;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #292e3a;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      color: #aaa;
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .username-box {
      background: #171b24;
      border: 1px solid #292e3a;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

    .username-box label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .username-box input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #343b4a;
      background: #0f1115;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .username-box input:focus {
      border-color: #5865f2;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
    }

    .product {
      background: #171b24;
      border: 1px solid #292e3a;
      border-radius: 14px;
      overflow: hidden;
      transition: 0.2s;
    }

    .product:hover {
      transform: translateY(-3px);
      border-color: #5865f2;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #10131a;
      display: block;
    }

    .product-info {
      padding: 15px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-price {
      color: #58e38a;
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 13px;
    }

    .order-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #25d366;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .order-btn:hover {
      opacity: 0.9;
    }

    .order-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 30px;
      color: #aaa;
      grid-column: 1 / -1;
    }

    .error {
      color: #ff7070;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px 10px;
      font-size: 13px;
    }

    /* POPUP */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #171b24;
      border: 1px solid #303746;
      border-radius: 15px;
      padding: 22px;
    }

    .modal-box h2 {
      margin-bottom: 15px;
    }

    .modal-product {
      color: #aaa;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .confirm-btn {
      background: #25d366;
      color: white;
    }

    .cancel-btn {
      background: #303642;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>🔥 ZERRAXX STORE</h1>
  <p>Blox Fruits Items</p>
</header>

<div class="container">

  <div class="username-box">
    <label for="robloxUsername">🎮 Roblox Username</label>
    <input
      type="text"
      id="robloxUsername"
      placeholder="Masukkan username Roblox"
      maxlength="30"
    >
  </div>

  <div id="products">
    <div class="loading">Loading products...</div>
  </div>

</div>

<footer>
  © 2026 Zerraxx Store
</footer>


<!-- ORDER POPUP -->
<div class="modal" id="orderModal">

  <div class="modal-box">

    <h2>Confirm Order</h2>

    <div class="modal-product" id="modalProductInfo">
      Product
    </div>

    <div class="modal-buttons">

      <button
        class="cancel-btn"
        onclick="closeModal()">
        Batal
      </button>

      <button
        class="confirm-btn"
        id="confirmOrderBtn">
        Order WhatsApp
      </button>

    </div>

  </div>

</div>


<script type="module">

  /* =========================================
     FIREBASE
  ========================================= */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyADyVbRfEbHlnwsx38Y6VMn51QbOEFfWgM",
    authDomain: "zerraxx-store.firebaseapp.com",
    projectId: "zerraxx-store",
    storageBucket: "zerraxx-store.firebasestorage.app",
    messagingSenderId: "946691118004",
    appId: "1:946691118004:web:cf189cc85f11380c3fd8e1",
    measurementId: "G-006D7F68L4"
  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  /* =========================================
     ELEMENTS
  ========================================= */

  const productsContainer =
    document.getElementById("products");

  const usernameInput =
    document.getElementById("robloxUsername");

  const orderModal =
    document.getElementById("orderModal");

  const modalProductInfo =
    document.getElementById("modalProductInfo");

  const confirmOrderBtn =
    document.getElementById("confirmOrderBtn");


  let selectedProduct = null;


  /* =========================================
     LOAD PRODUCTS
  ========================================= */

  async function loadProducts() {

    try {

      productsContainer.innerHTML =
        '<div class="loading">Loading products...</div>';

      const snapshot =
        await getDocs(collection(db, "products"));

      if (snapshot.empty) {

        productsContainer.innerHTML =
          '<div class="empty">Belum ada produk.</div>';

        return;
      }

      productsContainer.innerHTML = "";

      snapshot.forEach((doc) => {

        const product = {
          id: doc.id,
          ...doc.data()
        };

        const card =
          document.createElement("div");

        card.className = "product";


        /*
          Kalau image kosong, guna placeholder.
        */

        const image =
          product.image ||
          "https://via.placeholder.com/500x500?text=Product";


        const name =
          product.name ||
          "Unnamed Product";


        const price =
          Number(product.price || 0);


        card.innerHTML = `

          <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(name)}"
            onerror="this.src='https://via.placeholder.com/500x500?text=No+Image'"
          >

          <div class="product-info">

            <div class="product-name">
              ${escapeHTML(name)}
            </div>

            <div class="product-price">
              RM ${price.toFixed(2)}
            </div>

            <button
              class="order-btn"
              data-product-id="${escapeHTML(product.id)}"
            >
              Order Sekarang
            </button>

          </div>

        `;


        const button =
          card.querySelector(".order-btn");


        button.addEventListener("click", () => {

          openOrder(product);

        });


        productsContainer.appendChild(card);

      });

    }

    catch (error) {

      console.error(error);

      productsContainer.innerHTML = `
        <div class="error">
          Gagal load produk.<br>
          Pastikan Firestore Rules dan collection products betul.
        </div>
      `;

    }

  }


  /* =========================================
     OPEN ORDER
  ========================================= */

  function openOrder(product) {

    const username =
      usernameInput.value.trim();


    if (!username) {

      alert(
        "Sila masukkan Roblox Username dahulu."
      );

      usernameInput.focus();

      return;

    }


    selectedProduct = product;


    const name =
      product.name || "Product";


    const price =
      Number(product.price || 0);


    modalProductInfo.innerHTML = `

      <strong>${escapeHTML(name)}</strong><br>

      Harga: RM ${price.toFixed(2)}<br>

      Roblox Username:
      ${escapeHTML(username)}

    `;


    orderModal.style.display = "flex";

  }


  /* =========================================
     CLOSE MODAL
  ========================================= */

  window.closeModal = function() {

    orderModal.style.display = "none";

    selectedProduct = null;

  };


  /* =========================================
     ORDER WHATSAPP
  ========================================= */

  async function orderWhatsApp(product) {

    const robloxUsername =
      usernameInput.value.trim();


    if (!robloxUsername) {

      alert(
        "Sila masukkan Roblox Username."
      );

      return;

    }


    if (!product) {

      alert(
        "Product tidak dijumpai."
      );

      return;

    }


    const productId =
      product.id;


    const name =
      product.name || "Product";


    const price =
      Number(product.price || 0);


    try {

      confirmOrderBtn.disabled = true;

      confirmOrderBtn.textContent =
        "Saving Order...";


      /*
        SIMPAN ORDER KE FIRESTORE
      */

      const orderRef = await addDoc(
        collection(db, "orders"),
        {
          productId: productId,

          productName: name,

          price: price,

          robloxUsername: robloxUsername,

          status: "Pending",

          createdAt: serverTimestamp()
        }
      );


      /*
        BUAT MESEJ WHATSAPP
      */

      const message =

        `🔥 *ZERRAXX STORE - ORDER*%0A%0A` +

        `🎮 Roblox Username: ${robloxUsername}%0A` +

        `📦 Product: ${name}%0A` +

        `💰 Harga: RM ${price.toFixed(2)}%0A` +

        `🆔 Order ID: ${orderRef.id}%0A%0A` +

        `Status: Pending%0A%0A` +

        `Saya nak order item ini.`;


      /*
        NOMBOR WHATSAPP
        0193019528
      */

      const whatsappNumber =
        "60193019528";


      const whatsappURL =
        `https://wa.me/${whatsappNumber}?text=${message}`;


      /*
        Tutup popup
      */

      orderModal.style.display = "none";


      /*
        Buka WhatsApp
      */

      window.open(
        whatsappURL,
        "_blank"
      );


    }

    catch (error) {

      console.error(
        "Order error:",
        error
      );

      alert(
        "Order gagal disimpan. Sila cuba lagi."
      );

    }

    finally {

      confirmOrderBtn.disabled = false;

      confirmOrderBtn.textContent =
        "Order WhatsApp";

    }

  }


  /* =========================================
     CONFIRM BUTTON
  ========================================= */

  confirmOrderBtn.addEventListener(
    "click",
    () => {

      orderWhatsApp(
        selectedProduct
      );

    }
  );


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHTML(value) {

    return String(value)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  /* =========================================
     START
  ========================================= */

  loadProducts();

</script>

</body>
</html>
